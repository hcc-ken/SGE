<ion-header>
  <ion-toolbar color="secondary">
    <ion-title class="ion-text-center">
      <!--Ponemos [] para que "name" cambie según el valor recibido-->
      <!--En lenguaje humano, Elige el icono y muestralo según lo que diga icono()-->
      <!--Escribe en pantalla lo que diga la función nombre() Está en header.component-->
      <ion-icon [name] = "icono()"></ion-icon>
      {{nombre()}}</ion-title>
  </ion-toolbar>
</ion-header>
