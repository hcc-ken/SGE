<ion-header class="ion-no-border">
    <ion-toolbar>
        <ion-menu-toggle slot="start" menu="menu-among-us">
            <ion-avatar>
                <img src="assets/images/AmongUs.jpg" alt="">
            </ion-avatar>
        </ion-menu-toggle>
        <ion-title>Materials</ion-title>
    </ion-toolbar>
</ion-header>
<app-menu/>
<ion-content id="materials-page">
    <div class="ion-text-center">
        <ion-button id="abrir-modal">
            <ion-icon name="power"></ion-icon>
        </ion-button>
    </div>

    <ion-modal #modal trigger="abrir-modal" (willDismiss)="onWillDismiss($event)">
        <ng-template>
            <ion-header>
                <ion-toolbar>
                    <ion-buttons slot="start">
                        <ion-button (click)="modal.dismiss(null, 'cancel')" color="primary">
                            Cancel
                        </ion-button>
                    </ion-buttons>
                    <ion-buttons slot="start">
                        <ion-button (click)="modal.dismiss(null, 'aceptar')" color="primary">
                            Aceptar
                        </ion-button>
                    </ion-buttons>
                </ion-toolbar>
            </ion-header>
            <ion-content>
                <div class="ion-display-flex ion-justify-content-center">
                    <ion-button color="success" (click)="generateRandom()">
                        Random
                    </ion-button>
                </div>
                <p>
                    <ion-text color="success" class="ion-text-center">
                        {{randomNumber()}}
                    </ion-text>
                </p>
            </ion-content>
        </ng-template>
    </ion-modal>

    <ion-list>
        @for (material of dataZeldaMaterials(); track material.id) {
            <ion-item>
                <ion-avatar slot="end">
                    <img [src]="material.image" alt="">
                </ion-avatar>
                <ion-label>
                    <h2 class="ion-text-capitalize">{{material.name}}</h2>
                    <p>{{ material.description }}</p>
                </ion-label>
            </ion-item>
        }
    </ion-list>
</ion-content>
