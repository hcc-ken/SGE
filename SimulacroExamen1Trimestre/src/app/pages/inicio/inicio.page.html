<ion-content class="ion-padding">
  <swiper-container pagination="true">
    @for (slide of slides; track $index){
      <swiper-slide class="slide-full">
        <ion-card class="slide-card">
          <ion-img [src]="slide.img" class="slide-image" alt="Imagen del slide">
          </ion-img>
          <ion-card-content class="ion-text-center">
            <ion-label [color]="slide.color">{{ slide.desc }}</ion-label>
          </ion-card-content>
          @if ($last) {
            <ion-button id="Empezar" class="ion-display-flex ion-justify-content-center" color="success" routerLink="/materials">
              Empezar
            </ion-button>
          }
        </ion-card>
      </swiper-slide>
    }
  </swiper-container>
</ion-content>
